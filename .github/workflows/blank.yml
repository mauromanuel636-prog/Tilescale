name: Windows_RDP_VM

on:
  workflow_dispatch:

env:
  RDP_USER: runneradmin
  RDP_PASSWORD: "Tr0ca-Esta-S3nha!"   # <- altere aqui

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Conectar ao Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          hostname: gh-rdp-vm

      - name: Configurar RDP
        shell: powershell
        run: |
          net user $env:RDP_USER "$env:RDP_PASSWORD"

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

      - name: Mostrar acesso e manter a VM ativa
        shell: powershell
        run: |
          $tsIp = (& "C:\Program Files\Tailscale\tailscale.exe" ip -4).Trim()
          Write-Host "--- ACESSO RDP ---"
          Write-Host "Usuario: $env:RDP_USER"
          Write-Host "Senha: $env:RDP_PASSWORD"
          Write-Host "IP Tailscale: $tsIp"
          Write-Host "Nome: gh-rdp-vm"
          Write-Host "------------------"

          $end = (Get-Date).AddSeconds(21000)
          while ((Get-Date) -lt $end) {
            Write-Host "Heartbeat: VM ativa... $(Get-Date)"
            Start-Sleep -Seconds 300
          }
